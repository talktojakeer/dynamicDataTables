<template>
    <lightning-card icon-name={computedIcon}>
        <span slot="title">{cardTitle}</span>
        <lightning-button
            slot="actions"
            label={buttonLabel}
            variant="brand"
            icon-name="utility:add"
            onclick={openModal}>
        </lightning-button>

        <div class="slds-grid slds-gutters slds-p-around_medium">
            <div class="slds-col slds-size_1-of-2">
                <div class="insight-tile insight-tile_recruit">
                    <div class="insight-number">{recruitCount}</div>
                    <div class="insight-label">{recruitTileLabel}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <div class="insight-tile insight-tile_ftu">
                    <div class="insight-number">{ftuCount}</div>
                    <div class="insight-label">{ftuTileLabel}</div>
                </div>
            </div>
        </div>
    </lightning-card>

    <template if:true={showModal}>
        <c-recruit-class-new-button onclose={closeModal} onrefresh={handleRefresh}>
        </c-recruit-class-new-button>
    </template>
</template>
