<template>
    <div class="grading-page">

        <!-- ═══ LIST VIEW ═══ -->
        <template if:true={isListView}>

            <div class="page-header">
                <h1 class="page-title">Qual Roster</h1>
                <p class="page-sub">Select a roster to grade qualification results</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <lightning-icon icon-name="standard:list_email" size="small" class="list-header-icon"></lightning-icon>
                    <h2 class="card-title">Qual Rosters</h2>
                    <span class="card-sub member-count-badge">{filteredRosterCount} rosters</span>
                    <div class="list-actions">
                        <div class="search-box">
                            <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
                            <input type="text" class="search-input" placeholder="Search rosters..." value={listSearchKey} oninput={handleListSearch} />
                        </div>
                    </div>
                </div>
                <div class="card-body table-container">

                    <template if:true={isLoadingList}>
                        <div class="table-loading">
                            <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
                            <p class="loading-text">Loading rosters...</p>
                        </div>
                    </template>

                    <template if:false={isLoadingList}>
                        <template if:true={hasRosterRows}>
                            <div class="table-scroll-wrap">
                                <table class="roster-list-table">
                                    <thead>
                                        <tr class="list-header-row">
                                            <th class="lh-label">Roster Label</th>
                                            <th class="lh-location">Location</th>
                                            <th class="lh-instructor">Firearm Instructor</th>
                                            <th class="lh-date">Test Date</th>
                                            <th class="lh-count">Members</th>
                                            <th class="lh-created">Created</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={filteredRosterRows} for:item="row">
                                            <tr key={row.rosterLabel} class="list-row" data-label={row.rosterLabel} onclick={handleRosterRowClick}>
                                                <td class="td-label">
                                                    <span class="label-link">{row.rosterLabel}</span>
                                                </td>
                                                <td class="td-location">{row.location}</td>
                                                <td class="td-instructor">{row.instructorName}</td>
                                                <td class="td-date">{row.testDate}</td>
                                                <td class="td-count">
                                                    <span class="count-badge">{row.memberCount}</span>
                                                </td>
                                                <td class="td-created">{row.createdDate}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={hasRosterRows}>
                            <div class="empty-state">
                                <lightning-icon icon-name="utility:shield" size="large"></lightning-icon>
                                <p class="empty-title">No Qual Rosters found</p>
                                <p class="empty-sub">Create a Qual Roster first using the Create Qual Roster tab.</p>
                            </div>
                        </template>
                    </template>

                </div>
            </div>

        </template>

        <!-- ═══ GRADING VIEW ═══ -->
        <template if:true={isGradingView}>

            <div class="page-header grading-page-header">
                <div class="back-row">
                    <button class="btn-back" onclick={handleBackToList}>
                        <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
                        Back to Rosters
                    </button>
                </div>
                <div class="page-header-main">
                    <div>
                        <h1 class="page-title">{selectedLabel}</h1>
                        <p class="page-sub">Grade qualification results for this roster</p>
                    </div>
                    <template if:true={hasGradingData}>
                        <button class="btn-add-employee" onclick={openAddEmployeeModal}>
                            <lightning-icon icon-name="utility:adduser" size="xx-small" class="btn-add-icon"></lightning-icon>
                            Add to Roster
                        </button>
                    </template>
                </div>
            </div>

            <!-- Session header -->
            <template if:true={hasGradingData}>
                <div class="card session-header-card">
                    <div class="session-header-grid">
                        <div class="session-field">
                            <span class="session-field-label">Test Date</span>
                            <span class="session-field-value">{gradingData.testDate}</span>
                        </div>
                        <div class="session-field">
                            <span class="session-field-label">Firearm Instructor</span>
                            <span class="session-field-value">{gradingData.instructorName}</span>
                        </div>
                        <div class="session-field">
                            <span class="session-field-label">Location</span>
                            <span class="session-field-value">{gradingData.location}</span>
                        </div>
                        <div class="session-field">
                            <span class="session-field-label">Light Condition</span>
                            <span class="session-field-value">{gradingData.lightCondition}</span>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Loading -->
            <template if:true={isLoadingGrading}>
                <div class="table-loading">
                    <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
                    <p class="loading-text">Loading grading data...</p>
                </div>
            </template>

            <!-- Main content: sidebar + table -->
            <template if:false={isLoadingGrading}>
                <template if:true={hasGradingData}>
                    <div class="grading-layout">

                        <!-- Left sidebar -->
                        <div class="weapon-sidebar">
                            <div class="sidebar-title">WEAPONS</div>
                            <template for:each={weaponNavItems} for:item="nav">
                                <div key={nav.weaponType} class={nav.itemClass} data-weapon={nav.weaponType} onclick={handleWeaponSelect}>
                                    <div class="weapon-nav-top">
                                        <span class={nav.dotClass}></span>
                                        <span class="weapon-nav-label">{nav.label}</span>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Right panel -->
                        <div class="weapon-panel">
                            <template if:true={activeSummary}>
                                <div class="weapon-panel-header">
                                    <div class="weapon-panel-title-row">
                                        <span class={activeSummary.dotClass}></span>
                                        <h2 class="weapon-panel-title">{activeSummary.weaponType}</h2>
                                        <span class="badge badge-neutral">{activeSummary.badgeText}</span>
                                        <span class="badge badge-success">{activeSummary.qualified} qualified</span>
                                        <span class="badge badge-info">{activeSummary.at90} @ 90%+</span>
                                        <span class="badge badge-error">{activeSummary.notQualified} not qualified</span>
                                        <span class="graded-counter">{activeSummary.gradedText}</span>
                                    </div>
                                </div>
                            </template>

                            <template if:true={hasActiveRows}>
                                <div class="table-scroll-wrap">
                                    <table class="grading-table">
                                        <thead>
                                            <tr class="grading-header-row">
                                                <th class="th-name">Name</th>
                                                <th>Manufacturer</th>
                                                <th>Model</th>
                                                <th>Sight Type</th>
                                                <th>Weapon Code</th>
                                                <th>Qual Attempt</th>
                                                <th class="th-toggle">Qualified</th>
                                                <th class="th-toggle">Qualified at 90%?</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={activeRows} for:item="row">
                                                <tr key={row.detailId} class={row.groupClass}>
                                                    <td class="td-name-cell">
                                                        <template if:true={row.showName}>
                                                            <span class="member-name">{row.memberName}</span>
                                                            <template if:true={row.isFirearmsInstructor}>
                                                                <span class="instructor-badge" title="Firearm Instructor">FI</span>
                                                            </template>
                                                        </template>
                                                    </td>
                                                    <td class="td-readonly">
                                                        <template if:true={row.isOtherType}>
                                                            <input type="text" class="cell-input" value={row.manufacturer} maxlength="50" data-detail-id={row.detailId} data-field="manufacturer" onblur={handleFieldBlur} placeholder="Enter manufacturer" />
                                                        </template>
                                                        <template if:false={row.isOtherType}>
                                                            <template if:true={row.showName}>{row.manufacturer}</template>
                                                        </template>
                                                    </td>
                                                    <td class="td-readonly">
                                                        <template if:true={row.isOtherType}>
                                                            <input type="text" class="cell-input" value={row.model} maxlength="50" data-detail-id={row.detailId} data-field="model" onblur={handleFieldBlur} placeholder="Enter model" />
                                                        </template>
                                                        <template if:false={row.isOtherType}>
                                                            <template if:true={row.showName}>{row.model}</template>
                                                        </template>
                                                    </td>
                                                    <td class="td-readonly">
                                                        <template if:true={row.isOtherType}>
                                                            <input type="text" class="cell-input" value={row.sightType} maxlength="50" data-detail-id={row.detailId} data-field="sightType" onblur={handleFieldBlur} placeholder="Enter sight type" />
                                                        </template>
                                                        <template if:false={row.isOtherType}>
                                                            {row.sightType}
                                                        </template>
                                                    </td>
                                                    <td>
                                                        <select class="cell-select" data-detail-id={row.detailId} data-field="weaponCode" onchange={handleSelectChange}>
                                                            <option value="">--</option>
                                                            <template for:each={row.weaponCodeOptionsForRow} for:item="opt">
                                                                <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.value}</option>
                                                            </template>
                                                        </select>
                                                    </td>
                                                    <td>
                                                        <select class="cell-select" data-detail-id={row.detailId} data-field="qualificationAttempt" onchange={handleSelectChange}>
                                                            <option value="">--</option>
                                                            <option value="1st" selected={row.is1st}>1st</option>
                                                            <option value="2nd" selected={row.is2nd}>2nd</option>
                                                            <option value="3rd" selected={row.is3rd}>3rd</option>
                                                            <option value="4th" selected={row.is4th}>4th</option>
                                                        </select>
                                                    </td>
                                                    <td class="td-toggle">
                                                        <div class="toggle-group">
                                                            <button class="toggle-btn toggle-yes" data-detail-id={row.detailId} data-value="Yes" data-active={row.qualifiedYes} onclick={handleQualifiedToggle}>Yes</button>
                                                            <button class="toggle-btn toggle-no" data-detail-id={row.detailId} data-value="No" data-active={row.qualifiedNo} onclick={handleQualifiedToggle}>No</button>
                                                        </div>
                                                    </td>
                                                    <td class="td-toggle">
                                                        <template if:false={row.qualified90Disabled}>
                                                            <div class="toggle-group">
                                                                <button class="toggle-btn toggle-yes" data-detail-id={row.detailId} data-value="Yes" data-active={row.qualified90Yes} onclick={handleQualified90Toggle}>Yes</button>
                                                                <button class="toggle-btn toggle-no" data-detail-id={row.detailId} data-value="No" data-active={row.qualified90No} onclick={handleQualified90Toggle}>No</button>
                                                            </div>
                                                        </template>
                                                        <template if:true={row.qualified90Disabled}>
                                                            <div class="toggle-group toggle-disabled">
                                                                <button class="toggle-btn" disabled>Yes</button>
                                                                <button class="toggle-btn toggle-no" data-active="true" disabled>No</button>
                                                            </div>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Global Save Bar -->
                <template if:true={hasGradingData}>
                    <div class="grading-save-bar">
                        <button class="btn-save-grading" onclick={handleSaveAll} disabled={isSavingGrading}>
                            <template if:true={isSavingGrading}>
                                <lightning-spinner size="x-small" alternative-text="Saving..."></lightning-spinner>
                                Saving...
                            </template>
                            <template if:false={isSavingGrading}>
                                Save
                            </template>
                        </button>
                    </div>
                </template>

                <!-- Empty state for grading -->
                <template if:true={selectedLabel}>
                    <template if:false={hasGradingData}>
                        <div class="empty-state">
                            <lightning-icon icon-name="utility:list" size="large"></lightning-icon>
                            <p class="empty-title">No grading data found</p>
                            <p class="empty-sub">No weapon qualification records found for "{selectedLabel}".</p>
                        </div>
                    </template>
                </template>
            </template>

            <!-- Signature capture modal -->
            <template if:true={showSignatureModal}>
                <section class="sig-backdrop" role="dialog" aria-modal="true" aria-labelledby="sig-title">
                    <div class="sig-modal">

                        <div class="sig-header">
                            <h2 id="sig-title" class="sig-title">Certify Qualification Results</h2>
                            <button class="sig-close" title="Close" onclick={handleSignatureCancel}>&times;</button>
                        </div>

                        <p class="sig-instruction">Please sign below to certify these qualification results.</p>

                        <div class={signatureRowClass}>
                            <div class="sig-block">
                                <h3 class="sig-block-title">Firearm Instructor Signature</h3>
                                <p class="sig-note-line">Certifying instructor of record for these qualification results.</p>
                                <div class="sig-fields">
                                    <div class="sig-field">
                                        <label class="sig-field-label">Instructor Name</label>
                                        <input type="text" class="sig-input sig-input--readonly sig-input--name" value={instructorNameForSignature} readonly />
                                    </div>
                                    <div class="sig-field">
                                        <label class="sig-field-label">Date</label>
                                        <input type="text" class="sig-input sig-input--readonly" value={certificationDate} readonly />
                                    </div>
                                </div>
                                <c-signature-pad data-pad="instructor" signer-name={instructorNameForSignature}></c-signature-pad>
                            </div>

                            <template if:true={needsWitnessSignature}>
                                <div class="sig-block sig-witness-block">
                                    <h3 class="sig-block-title">Witness Signature</h3>
                                    <p class="sig-note-line">A witness is required because the firearm instructor is also being graded on this roster.</p>
                                    <div class="sig-fields">
                                        <div class="sig-field">
                                            <label class="sig-field-label" for="witnessNameInput">Witness Name <span class="required-star">*</span></label>
                                            <input id="witnessNameInput" type="text" class="sig-input" value={witnessName} maxlength="255" oninput={handleWitnessNameInput} placeholder="Enter witness full name" />
                                        </div>
                                        <div class="sig-field">
                                            <label class="sig-field-label">Date</label>
                                            <input type="date" class="sig-input" value={witnessDate} onchange={handleWitnessDateInput} />
                                        </div>
                                    </div>
                                    <c-signature-pad data-pad="witness" signer-name={witnessName}></c-signature-pad>
                                </div>
                            </template>
                        </div>

                        <div class="cert-box">
                            <label class="cert-item">
                                <input type="checkbox" checked={certifyAccurate} onchange={handleCertifyAccurate} />
                                <span class="cert-text">I certify that the qualification results entered are accurate and complete.</span>
                            </label>
                            <label class="cert-item">
                                <input type="checkbox" checked={certifyProficiency} onchange={handleCertifyProficiency} />
                                <span class="cert-text">I certify that each individual demonstrated proficiency in the care and cleaning of their assigned weapon(s) and was verified prior to completing the qualification.</span>
                            </label>
                        </div>

                        <template if:true={signatureError}>
                            <p class="sig-error">{signatureError}</p>
                        </template>

                        <div class="sig-footer">
                            <button class="sig-btn sig-btn-clear" onclick={handleClearAllSignatures}>Clear</button>
                            <div class="sig-footer-right">
                                <button class="sig-btn sig-btn-cancel" onclick={handleSignatureCancel}>Cancel</button>
                                <button class="sig-btn sig-btn-save" onclick={handleSignatureSave} disabled={isSavingGrading}>
                                    <template if:true={isSavingGrading}>Saving...</template>
                                    <template if:false={isSavingGrading}>Save</template>
                                </button>
                            </div>
                        </div>

                    </div>
                </section>
            </template>

            <!-- Add Employee(s) modal -->
            <template if:true={showAddModal}>
                <section class="sig-backdrop" role="dialog" aria-modal="true" aria-labelledby="add-title">
                    <div class="add-modal">

                        <div class="sig-header">
                            <h2 id="add-title" class="sig-title">Add Employees to Roster</h2>
                            <button class="sig-close" title="Close" onclick={closeAddEmployeeModal}>&times;</button>
                        </div>

                        <div class="add-body">
                            <!-- Employee picker -->
                            <div class="add-col add-col--employees">
                                <div class="add-section-head">
                                    <label class="add-section-label">Employees</label>
                                    <button class="add-create-toggle" onclick={toggleCreateEmployee}>
                                        <lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>
                                        New Employee
                                    </button>
                                </div>

                                <!-- Create new employee (retired officer) -->
                                <template if:true={showCreateEmployee}>
                                    <div class="create-emp-box">
                                        <p class="create-emp-title">Create New Employee</p>
                                        <div class="create-emp-fields">
                                            <input type="text" class="add-search-input" placeholder="First name"
                                                   value={newFirstName} oninput={handleNewFirstName} />
                                            <input type="text" class="add-search-input" placeholder="Middle name"
                                                   value={newMiddleName} oninput={handleNewMiddleName} />
                                            <input type="text" class="add-search-input" placeholder="Last name *"
                                                   value={newLastName} oninput={handleNewLastName} />
                                        </div>
                                        <div class="create-emp-fields">
                                            <div class="create-emp-labeled">
                                                <label class="create-emp-flabel">Date of Birth</label>
                                                <input type="date" class="add-search-input"
                                                       value={newDob} onchange={handleNewDob} />
                                            </div>
                                            <div class="create-emp-labeled">
                                                <label class="create-emp-flabel">Retirement Date</label>
                                                <input type="date" class="add-search-input"
                                                       value={newYearRetired} onchange={handleNewYearRetired} />
                                            </div>
                                        </div>
                                        <div class="create-emp-fields">
                                            <div class="create-emp-labeled">
                                                <label class="create-emp-flabel">Type of Retired Peace Officer</label>
                                                <lightning-combobox class="add-detail-field" label="Type of Retired Peace Officer"
                                                    variant="label-hidden" placeholder="-- Select --"
                                                    value={newRetiredType} options={retiredTypeOptions}
                                                    onchange={handleNewRetiredType}></lightning-combobox>
                                            </div>
                                        </div>
                                        <label class="create-emp-retired">
                                            <input type="checkbox" checked={newIsRetired} onchange={handleNewIsRetired} />
                                            <span>Retired officer (mark as inactive)</span>
                                        </label>
                                        <div class="create-emp-actions">
                                            <button class="sig-btn sig-btn-cancel" onclick={toggleCreateEmployee}>Cancel</button>
                                            <button class="sig-btn sig-btn-save" onclick={handleCreateEmployee} disabled={isCreatingEmployee}>
                                                <template if:true={isCreatingEmployee}>Creating...</template>
                                                <template if:false={isCreatingEmployee}>Create &amp; Select</template>
                                            </button>
                                        </div>
                                    </div>
                                </template>

                                <div class="add-search">
                                    <lightning-icon icon-name="utility:search" size="xx-small" class="add-search-icon"></lightning-icon>
                                    <input type="text" class="add-search-input add-search-input--search" placeholder="Search employees..."
                                           value={employeeSearchKey} oninput={handleEmployeeSearch} />
                                </div>

                                <template if:true={employeeCountHint}>
                                    <p class="emp-count-hint">{employeeCountHint}</p>
                                </template>

                                <template if:true={isLoadingEmployees}>
                                    <div class="add-loading">
                                        <lightning-spinner size="small" alternative-text="Loading..."></lightning-spinner>
                                    </div>
                                </template>

                                <template if:false={isLoadingEmployees}>
                                    <div class="emp-list">
                                        <template for:each={availableEmployees} for:item="emp">
                                            <div key={emp.contactId} class={emp.rowClass}
                                                 data-id={emp.contactId} onclick={handleEmployeeToggle}>
                                                <input type="checkbox" class="emp-check" checked={emp.selected} tabindex="-1" />
                                                <div class="emp-info">
                                                    <span class="emp-name">
                                                        {emp.name}
                                                        <template if:true={emp.isFirearmsInstructor}>
                                                            <span class="emp-fi-badge">FI</span>
                                                        </template>
                                                        <template if:true={emp.isRetiredOfficer}>
                                                            <span class="emp-retired-badge">Retired</span>
                                                        </template>
                                                    </span>
                                                    <template if:true={emp.hasRetiredInfo}>
                                                        <span class="emp-retired-info">{emp.retiredLabel}</span>
                                                    </template>
                                                    <template if:true={emp.hasExisting}>
                                                        <span class="emp-existing">{emp.existingLabel}</span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={noEmployeesFound}>
                                            <div class="emp-empty">No employees found.</div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Weapon types + details -->
                            <div class="add-col add-col--weapons">
                                <label class="add-section-label">Weapon Type</label>
                                <p class="add-hint">A weapon an employee already has is skipped automatically.</p>
                                <lightning-combobox class="add-detail-field" label="Weapon Type" value={addWeaponType}
                                    placeholder="-- Select --" options={weaponTypeSelectOptions} onchange={handleAddWeaponType}
                                    variant="label-hidden"></lightning-combobox>

                                <label class="add-section-label add-details-label">Weapon Details (optional)</label>
                                <p class="add-hint">Applied to every new row added.</p>
                                <lightning-combobox class="add-detail-field" label="Manufacturer" value={addManufacturer}
                                    placeholder="-- None --" options={manufacturerOptions} onchange={handleAddManufacturer}
                                    disabled={isManufacturerDisabled}
                                    variant="label-stacked"></lightning-combobox>
                                <lightning-combobox class="add-detail-field" label="Model" value={addModel}
                                    placeholder="-- None --" options={modelOptions} onchange={handleAddModel}
                                    disabled={isModelDisabled}
                                    variant="label-stacked"></lightning-combobox>
                                <lightning-combobox class="add-detail-field" label="Sight Type" value={addSightType}
                                    placeholder="-- None --" options={sightTypeOptions} onchange={handleAddSightType}
                                    disabled={isSightTypeDisabled}
                                    variant="label-stacked"></lightning-combobox>
                            </div>
                        </div>

                        <template if:true={addError}>
                            <p class="sig-error">{addError}</p>
                        </template>

                        <div class="sig-footer">
                            <span class="add-selected-count">{selectedEmployeeCount} selected</span>
                            <div class="sig-footer-right">
                                <button class="sig-btn sig-btn-cancel" onclick={closeAddEmployeeModal}>Cancel</button>
                                <button class="sig-btn sig-btn-save" onclick={handleAddEmployees}
                                        disabled={isAddingEmployees}>
                                    <template if:true={isAddingEmployees}>Adding...</template>
                                    <template if:false={isAddingEmployees}>{addButtonLabel}</template>
                                </button>
                            </div>
                        </div>

                    </div>
                </section>
            </template>

        </template>

    </div>
</template>
